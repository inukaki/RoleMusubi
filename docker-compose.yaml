services:
  api:
    build: ./api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - my_network
  db:
    image: postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - my_network
  bot:
    build: ./bot
    env_file: .env
    volumes:
      - ./bot:/usr/src/bot
      - /usr/src/bot/node_modules
    networks:
      - my_network
volumes:
  db_data:
networks:
  my_network:
    driver: bridge